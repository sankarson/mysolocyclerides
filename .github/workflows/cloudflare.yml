# Deploys the site to Cloudflare (Workers static assets) on every push to main.
# Requires the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# plus Zone: Workers Routes/DNS: Edit for the cycling.sankarson.in custom domain).
name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Wrangler
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9d00b97df3ae44590748af48b5a73569
